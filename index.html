<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile web-app config -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NNEvo" />
  <meta name="theme-color" content="#080810" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>NNEvo</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Thin top bar -->
<header class="top-bar">
  <span class="logo">NNEvo</span>
  <div class="top-controls">
    <button id="btn-play-pause" class="ctrl-btn" title="Play / Pause">⏸</button>
    <button id="btn-speed"      class="ctrl-btn speed-btn" title="Cycle speed">1×</button>
    <button id="btn-reset"      class="ctrl-btn dim-btn"   title="Reset evolution">↺</button>
    <div class="divider"></div>
    <button id="btn-edit"       class="ctrl-btn"           title="Toggle maze editor">✏ Edit</button>
    <label class="chk-label">
      <input type="checkbox" id="chk-grid" /> Grid
    </label>
  </div>
</header>

<!-- Canvas -->
<main class="stage">
  <div class="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
    <canvas id="editOverlay"></canvas>
  </div>

  <!-- Edit toolbar – 2-row strip, shown only in edit mode -->
  <div class="edit-bar" id="edit-bar">
    <div class="edit-row">
      <button id="btn-clear" class="dim-btn">Clear</button>
      <div class="spacer"></div>
      <button id="btn-save-maze" title="Save to browser">💾</button>
      <button id="btn-load-maze" title="Load from browser">📂</button>
    </div>
    <div class="edit-row">
      <span class="bar-label">Preset</span>
      <button data-preset="empty">Empty</button>
      <button data-preset="cross">Cross</button>
      <button data-preset="rooms">Rooms</button>
      <button data-preset="spiral">Spiral</button>
      <button data-preset="zigzag">Zigzag</button>
    </div>
  </div>
</main>

<!-- Reset confirmation modal -->
<div id="modal-reset" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-title">Reset Evolution?</div>
    <div class="modal-body">All generations and neural networks will be wiped. This cannot be undone.</div>
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-confirm" class="modal-danger">Reset</button>
    </div>
  </div>
</div>

<!-- PWA service worker registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>

<!-- Scripts – order matters -->
<script src="js/config.js"></script>
<script src="js/Sprites.js"></script>
<script src="js/NeuralNetwork.js"></script>
<script src="js/GeneticAlgorithm.js"></script>
<script src="js/Maze.js"></script>
<script src="js/Agent.js"></script>
<script src="js/Simulation.js"></script>
<script src="js/Renderer.js"></script>
<script src="js/UI.js"></script>
<script src="js/main.js"></script>

</body>
</html>
